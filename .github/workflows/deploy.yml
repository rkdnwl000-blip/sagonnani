name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Railway가 GitHub 연동으로 main push 시 자동 배포하므로
# 이 워크플로우는 빌드 검증(CI)만 담당합니다.

jobs:
  build-api:
    name: API 빌드 검증
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: 의존성 설치
        run: yarn workspace @sagonnani/api install --frozen-lockfile

      - name: Prisma 클라이언트 생성
        run: yarn workspace @sagonnani/api prisma generate

      - name: TypeScript 빌드
        run: yarn workspace @sagonnani/api build

  build-admin:
    name: Admin 빌드 검증
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: 의존성 설치
        run: yarn workspace @sagonnani/admin install --frozen-lockfile

      - name: Next.js 빌드
        run: yarn workspace @sagonnani/admin build
        env:
          NEXT_PUBLIC_API_URL: https://api.sagonnani.com/api/v1
